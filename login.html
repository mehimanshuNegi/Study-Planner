<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner — Student Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background-color: var(--bg-canvas);">

    <div class="auth-card" style="width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 36px 32px; box-shadow: var(--shadow-card);">
        
        <!-- Brand Header -->
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
            <div class="brand-icon" style="width: 42px; height: 42px; font-size: 16px;">SP</div>
            <div class="brand-info">
                <span class="brand-title" style="font-size: 18px;">Study Planner</span>
                <span class="brand-subtitle">Student Productivity &amp; Planning</span>
            </div>
        </div>

        <h2 style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">Welcome back</h2>
        <p style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px;">Sign in to your academic dashboard and track daily progress.</p>

        <!-- Error Notification Banner -->
        <div id="authErrorMessage" style="display: none; padding: 10px 14px; margin-bottom: 18px; border-radius: var(--radius-sm); background-color: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-text); font-size: 13px;"></div>

        <!-- Success Notification Banner -->
        <div id="authSuccessMessage" style="display: none; padding: 10px 14px; margin-bottom: 18px; border-radius: var(--radius-sm); background-color: var(--sage-bg); border: 1px solid var(--sage-border); color: var(--sage-text); font-size: 13px;"></div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="loginEmail" style="display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Student Email Address</label>
                <input type="email" id="loginEmail" placeholder="student@example.com" required style="width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid var(--border-medium); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-primary); outline: none;">
            </div>

            <div class="form-group" style="margin-bottom: 22px;">
                <label for="loginPassword" style="display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required style="width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid var(--border-medium); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-primary); outline: none;">
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn" style="width: 100%; padding: 11px; font-size: 14px; font-weight: 600; justify-content: center; margin-bottom: 14px;">Sign In</button>
        </form>

        <div style="text-align: center; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 18px; margin-top: 18px;">
            Don't have an account? 
            <a href="register.html" style="color: var(--lavender-solid); font-weight: 600; text-decoration: underline;">Create Student Account</a>
        </div>
    </div>

    <!-- Script Services -->
    <script src="services/apiClient.js"></script>
    <script src="services/authService.js"></script>
    <script>
        function showError(msg) {
            const errBox = document.getElementById('authErrorMessage');
            errBox.textContent = msg;
            errBox.style.display = 'block';
            document.getElementById('authSuccessMessage').style.display = 'none';
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginSubmitBtn');

            if (!email || !password) {
                showError('Please fill in both email and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                await authService.login(email, password);
                window.location.href = 'index.html';
            } catch (err) {
                showError(err.message || 'Login failed. Please check your credentials.');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        // Redirect if already authenticated
        document.addEventListener('DOMContentLoaded', async () => {
            if (apiClient.getToken()) {
                const user = await authService.checkAuth(false);
                if (user) {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>
</body>
</html>
